name: Bug report
description: Report a reproducible AutoVQE problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command and problem file.
      placeholder: |
        uv run harness.py solve examples/h2_2q.json --rel-tol 0.001
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant terminal output or log excerpt.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or release version.
    validations:
      required: false
