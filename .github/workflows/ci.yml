name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run python -m compileall -q autovqe tests
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m autovqe.harness check
