name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run python -m py_compile autovqe/prepare.py autovqe/train.py autovqe/harness.py
      - run: uv run python -m autovqe.harness check
      - run: uv run python -m autovqe.harness solve examples/h2_2q.json examples/h2_4q.json examples/ising_1d_5q.json --rel-tol 0.001 --max-stages 2
